[project]
name = "rondimob"
version = "0.1.0"
description = "Public portal for rondimob products and plans"
requires-python = "==3.13.15"
dependencies = [
    "django==6.1.1",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.11",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
python_files = ["test_*.py"]
pythonpath = ["."]
